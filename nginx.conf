server {
    listen 80;
    server_name _;

    # Thư mục chứa code React sau khi build
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình cực kỳ quan trọng cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu hóa: Cache các file tĩnh (ảnh, css, js) trong 1 năm để web load siêu nhanh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
